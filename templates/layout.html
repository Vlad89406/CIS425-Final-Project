<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title if title else 'Co-op Portal' }}</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Global Styles -->
  <style>
    body {
      background-color: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #e4e7f1;
    }
    .card-soft {
      border: 1px solid #e4e7f1;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
    }
    .icon-circle {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #eef2ff;
      font-size: 1.25rem;
    }
    .badge-soft {
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-status-green {
      background-color: #e7f8ee;
      color: #15803d;
    }
    .badge-status-blue {
      background-color: #e0f2fe;
      color: #0369a1;
    }
    .badge-status-gray {
      background-color: #f3f4f6;
      color: #4b5563;
    }
    .pill-priority-high {
      background-color: #fee2e2;
      color: #b91c1c;
    }
    .pill-priority-med {
      background-color: #fef3c7;
      color: #92400e;
    }
    .pill-priority-low {
      background-color: #e0f2fe;
      color: #075985;
    }
  </style>
</head>

<body>

<nav class="navbar py-2">
  <div class="container-fluid px-4">
    <span class="navbar-brand fw-bold">Co-op Portal</span>
    {% if user %}
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-muted small">Welcome, <strong>{{ user.name }}</strong></span>
      <a href="/logout" class="btn btn-sm btn-outline-secondary">Logout</a>
    </div>
    {% endif %}
  </div>
</nav>

<div class="container-fluid px-4 py-4">
  {% block content %}
  <!-- Page-specific content goes here -->
  {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
