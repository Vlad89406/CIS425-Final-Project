{% extends "layout.html" %}
{% block content %}

<h2 class="mb-3">Co-op Students ({{ user.raw.department }} Department)</h2>

<div class="card card-soft p-3">
  <table class="table align-middle">
    <thead class="table-light">
      <tr>
        <th>Student</th>
        <th>Major</th>
        <th>Status</th>
        <th class="text-end">Action</th>
      </tr>
    </thead>

    <tbody>
      {% for s in students %}
      <tr>
        <td><strong>{{ s.name }}</strong></td>
        <td>{{ s.major }}</td>
        <td>
          <span class="badge bg-{{ s.badge }}">{{ s.computed_status }}</span>
        </td>
        <td class="text-end">
          <a href="{{ url_for('faculty_review_coop', coop_id=s.id) }}"
             class="btn btn-sm btn-primary">
            Review
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
