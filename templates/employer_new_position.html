{% extends "layout.html" %}
{% block content %}

<a href="{{ url_for('employer_dashboard') }}" class="btn btn-sm btn-outline-secondary mb-3">
  ← Back to Dashboard
</a>

<h2 class="mb-2">Post a New Internship</h2>
<p class="text-muted mb-4">
  Provide details about the co-op position so students can apply.
</p>

<form method="post">
  <div class="card card-soft p-4 mb-4">
    <h5 class="mb-3">Position Details</h5>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Position Title</label>
        <input type="text" class="form-control" name="title" placeholder="e.g., Software Engineer Co-op" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Location</label>
        <input type="text" class="form-control" name="location" placeholder="e.g., Remote, Dearborn, MI" required>
      </div>

      <div class="col-md-3">
        <label class="form-label">Number of Weeks</label>
        <input type="number" class="form-control" name="weeks" min="1" required>
      </div>

      <div class="col-md-3">
        <label class="form-label">Hours per Week</label>
        <input type="number" class="form-control" name="hours_per_week" min="1" required>
      </div>

      <div class="col-md-3">
        <label class="form-label">Job Type</label>
        <select class="form-select" name="job_type">
          <option value="Full-time">Full-time</option>
          <option value="Part-time">Part-time</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Salary / Hourly Rate</label>
        <input type="text" class="form-control" name="salary" placeholder="$25–30/hr">
      </div>
    </div>
  </div>

  <div class="card card-soft p-4 mb-4">
    <h5 class="mb-3">Qualifications</h5>

    <div class="mb-3">
      <label class="form-label">Majors of Interest</label>
      <input type="text"
             class="form-control"
             name="majors"
             placeholder="e.g., CIS, Computer Science, Software Engineering">
      <small class="text-muted">List majors separated by commas.</small>
    </div>

    <div class="mb-3">
      <label class="form-label">Required Skills</label>
      <textarea class="form-control"
                name="required_skills"
                rows="2"
                placeholder="e.g., Python, SQL, basic web development"
      ></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Preferred Skills</label>
      <textarea class="form-control"
                name="preferred_skills"
                rows="2"
                placeholder="e.g., React, cloud services, Docker"
      ></textarea>
    </div>
  </div>

  <div class="card card-soft p-4 mb-4">
    <h5 class="mb-3">Job Description</h5>
    <textarea class="form-control"
              name="description"
              rows="4"
              placeholder="Describe the role, responsibilities, and learning outcomes for the student."
              required
    ></textarea>
  </div>

  <div class="d-flex justify-content-end">
    <button type="submit" class="btn btn-primary">
      Post Internship
    </button>
  </div>
</form>

{% endblock %}
